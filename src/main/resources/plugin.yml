name: giveaway_plugin
version: ${version}
main: first.giveaway_plugin.GiveawayPlugin
api-version: '26.3'
softdepend: [Nexo]
commands:
  giveaway:
    description: "Startet das Giveaway"
    usage: "/giveaway"
  reloadgiveaway:
    description: "Lädt das Plugin neu"
    usage: "/reloadgiveaway"
  giveawayconfig:
    description: "Öffnet das Config-Menü"
    usage: "/giveawayconfig"
permissions:
  giveaway.config:
    description: "Erlaubt den Spielern, das Config-Menü zu öffnen"
    default: op
  giveaway.reload:
    description: "Erlaubt den Spielern, das Giveaway-Plugin neu zu laden"
    default: op
  giveaway.use:
    description: "Erlaubt den Spielern, /giveaway zu nutzen"
    default: op