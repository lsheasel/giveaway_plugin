name: giveaway_plugin
version: ${version}
main: first.giveaway_plugin.GiveawayPlugin
api-version: '26.3'
softdepend: [Nexo]
commands:
  giveaway:
    description: "Starts a giveaway with the item in your hand"
    usage: "/giveaway"
  reloadgiveaway:
    description: "Reloads the config"
    usage: "/reloadgiveaway"
  giveawayconfig:
    description: "Opens the config menu"
    usage: "/giveawayconfig"
permissions:
  giveaway.config:
    description: "Allows players to open the config menu"
    default: op
  giveaway.reload:
    description: "Allows players to reload the giveaway plugin"
    default: op
  giveaway.use:
    description: "Allows players to use /giveaway"
    default: op